<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="succulentPotGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#A1887F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6D4C41;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="succulentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#81C784;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#388E3C;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- 花盆 -->
  <circle cx="100" cy="170" r="40" fill="url(#succulentPotGradient)" />
  <path d="M60 170 L140 170 L140 190 L60 190 Z" fill="url(#succulentPotGradient)" />
  <!-- 多肉植物叶片 -->
  <ellipse cx="100" cy="120" rx="5" ry="40" fill="url(#succulentGradient)" />
  <ellipse cx="100" cy="120" rx="40" ry="5" fill="url(#succulentGradient)" />
  <ellipse cx="100" cy="120" rx="7" ry="35" transform="rotate(45 100 120)" fill="url(#succulentGradient)" />
  <ellipse cx="100" cy="120" rx="7" ry="35" transform="rotate(135 100 120)" fill="url(#succulentGradient)" />
  <ellipse cx="100" cy="120" rx="7" ry="35" transform="rotate(225 100 120)" fill="url(#succulentGradient)" />
  <ellipse cx="100" cy="120" rx="7" ry="35" transform="rotate(315 100 120)" fill="url(#succulentGradient)" />
  <!-- 中心小叶片 -->
  <circle cx="100" cy="100" r="15" fill="#66BB6A" />
</svg>