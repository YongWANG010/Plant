<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Plant Buddies</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="icon" href="./favicon.ico" type="image/svg+xml">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body>
    <div id="app">
        <header>
            <h1>Plant Buddies</h1>
            <nav>
                <a href="index.html">Home</a>
                <a href="community.html">Community</a>
                <a href="guide.html">Care Guides</a>
                <a href="register.html" class="register-btn">Register</a>
            </nav>
        </header>
        
        <main>
            <section class="login-container">
                <div class="login-form">
                    <h2>Welcome Back!</h2>
                    <p>Log in to access your Plant Buddies account and community features.</p>
                    
                    <form @submit.prevent="login">
                        <div class="form-group">
                            <label for="email">Email Address</label>
                            <input type="email" id="email" v-model="form.email" required placeholder="your@email.com">
                        </div>
                        
                        <div class="form-group">
                            <label for="password">Password</label>
                            <input type="password" id="password" v-model="form.password" required placeholder="Your password">
                        </div>
                        
                        <div class="form-options">
                            <div class="checkbox">
                                <input type="checkbox" id="remember" v-model="form.remember">
                                <label for="remember">Remember me</label>
                            </div>
                            <a href="#" class="forgot-password">Forgot password?</a>
                        </div>
                        
                        <button type="submit" class="primary-btn login-submit">Sign In</button>
                    </form>
                    
                    <div class="register-link">
                        <p>Don't have an account? <a href="register.html">Register now</a></p>
                    </div>
                </div>
                
                <div class="login-image">
                    <img src="./images/succulent.svg" alt="Welcome Back" class="login-illustration">
                </div>
            </section>
        </main>
        
        <footer>
            <p>&copy; 2023 Plant Buddies. All rights reserved.</p>
        </footer>
    </div>
    
    <script>
        const { createApp } = Vue
        
        createApp({
            data() {
                return {
                    form: {
                        email: '',
                        password: '',
                        remember: false
                    },
                    error: ''
                }
            },
            methods: {
                login() {
                    // In a real application, this would authenticate with a server
                    console.log('Login data:', this.form)
                    alert('Login successful! In a full implementation, you would be logged in.')
                    window.location.href = 'index.html'
                }
            }
        }).mount('#app')
    </script>
</body>
</html>
