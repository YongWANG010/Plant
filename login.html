<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Plant Buddies</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Source+Sans+Pro:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app">
        <header>
            <div class="container header-container">
                <a href="index.html" class="logo">Plant Buddies</a>
                <nav>
                    <ul class="nav-links">
                        <li><a href="index.html">Home</a></li>
                        <li><a href="community.html">Community</a></li>
                        <li><a href="guide.html">Care Guides</a></li>
                    </ul>
                    <a href="register.html" class="register-btn">Register</a>
                </nav>
            </div>
        </header>
        
        <main>
            <section class="login-container">
                <div class="login-form">
                    <h2>Welcome Back!</h2>
                    <p>Log in to access your Plant Buddies account and community features.</p>
                    
                    <form @submit.prevent="login">
                        <div class="form-group">
                            <label for="email">Email Address</label>
                            <input type="email" id="email" v-model="form.email" required placeholder="your@email.com">
                        </div>
                        
                        <div class="form-group">
                            <label for="password">Password</label>
                            <input type="password" id="password" v-model="form.password" required placeholder="Your password">
                        </div>
                        
                        <div class="form-options">
                            <div class="checkbox">
                                <input type="checkbox" id="remember" v-model="form.remember">
                                <label for="remember">Remember me</label>
                            </div>
                            <a href="#" class="forgot-password">Forgot password?</a>
                        </div>
                        
                        <button type="submit" class="primary-btn login-submit">Sign In</button>
                    </form>
                    
                    <div class="register-link">
                        <p>Don't have an account? <a href="register.html">Register now</a></p>
                    </div>
                </div>
                
                <div class="login-image">
                    <img src="./images/1.jpg" alt="Welcome Back" class="login-illustration">
                </div>
            </section>
        </main>
        
        <footer>
            <p>&copy; 2023 Plant Buddies. All rights reserved.</p>
        </footer>
    </div>
    
    <script>
        const { createApp } = Vue
        
        createApp({
            data() {
                return {
                    form: {
                        email: '',
                        password: '',
                        remember: false
                    },
                    error: ''
                }
            },
            methods: {
                login() {
                    // In a real application, this would authenticate with a server
                    console.log('Login data:', this.form)
                    alert('Login successful! In a full implementation, you would be logged in.')
                    window.location.href = 'index.html'
                }
            }
        }).mount('#app')
    </script>
    
    <script>
        // Navbar scroll effect
        window.addEventListener('scroll', function() {
            const header = document.querySelector('header');
            if (window.scrollY > 50) {
                header.classList.add('scrolled');
            } else {
                header.classList.remove('scrolled');
            }
        });
    </script>
</body>
</html>
